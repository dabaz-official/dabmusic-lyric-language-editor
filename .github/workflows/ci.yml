name: CI

# lint, typecheck, test, and build, in one place: the definition lives in
# https://github.com/dabaz-official/.github/blob/main/.github/workflows/web-ci.yml
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: dabaz-official/.github/.github/workflows/web-ci.yml@main
